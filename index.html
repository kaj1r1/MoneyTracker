<!DOCTYPE html>
<html lang="id" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#166534" />
  <title>Personal Wallet</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js v4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            'surface-dark': '#132A23',
            'surface-dark-2': '#1A3B31',
            'bg-dark': '#0A1F1B',
            'border-dark': '#1F4A3C',
          },
          animation: {
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-down': 'slideDown 0.25s ease-in forwards',
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'scale-pop': 'scalePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
          },
          keyframes: {
            slideUp: {
              from: { transform: 'translateY(100%)', opacity: '0' },
              to: { transform: 'translateY(0)', opacity: '1' },
            },
            slideDown: {
              from: { transform: 'translateY(0)', opacity: '1' },
              to: { transform: 'translateY(100%)', opacity: '0' },
            },
            fadeIn: {
              from: { opacity: '0', transform: 'translateY(8px)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            },
            scalePop: {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '60%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
          },
        },
      },
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="bg-green-50 dark:bg-[#0A1F1B] text-gray-900 dark:text-gray-100 font-sans transition-colors duration-300">

  <!-- ========================================== -->
  <!-- APP CONTAINER — Max 480px Centered Mobile   -->
  <!-- ========================================== -->
  <div class="max-w-[480px] mx-auto min-h-screen bg-green-50 dark:bg-[#0A1F1B] relative flex flex-col justify-between shadow-sm">

    <!-- ======= Main Content View ======= -->
    <main id="app-content" class="px-4 pt-5 pb-28 animate-fade-in flex-1">
      <!-- Views render here dynamically -->
    </main>

    <!-- ========================================== -->
    <!-- BOTTOM NAVIGATION DENGAN UNIQUE FLOATING FAB -->
    <!-- ========================================== -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 pointer-events-none">
      <nav class="bottom-nav pointer-events-auto bg-green-800 dark:bg-[#0A1F1B] rounded-t-[28px]
                  h-[64px] z-40 relative
                  shadow-[0_-8px_30px_rgba(20,83,45,0.35)]
                  border-t border-green-700/40 dark:border-green-900/60
                  no-select flex items-center justify-between">

        <!-- Sisi Kiri: 2 menu (Home & Wallets) -->
        <div class="flex-1 flex items-center justify-evenly pr-7">
          <!-- 1. Home (default active) -->
          <a href="#/dashboard" data-nav="#/dashboard" data-label="Home"
             class="nav-item nav-active flex items-center gap-1.5 bg-lime-400 text-green-900 px-3.5 py-2 rounded-full font-semibold text-sm transition-all duration-200">
            <i data-lucide="home" class="w-[18px] h-[18px]"></i>
            <span class="nav-label text-[13px]">Home</span>
          </a>

          <!-- 2. Wallets -->
          <a href="#/wallets" data-nav="#/wallets" data-label="Wallets"
             class="nav-item p-2.5 rounded-full text-green-300/60 hover:text-green-100 transition-all duration-200">
            <i data-lucide="wallet" class="w-[20px] h-[20px]"></i>
          </a>
        </div>

        <!-- Sisi Tengah: UNIQUE FLOATING ADD BUTTON — DIKUNCI DI POSISI ABSOLUT TENGAH (TIDAK AKAN BERPINDAH) -->
        <div class="absolute left-1/2 -translate-x-1/2 -top-5 z-50 flex flex-col items-center pointer-events-auto">
          <button
            id="floatingAddBtn"
            onclick="openAddModal()"
            aria-label="Tambah Transaksi Baru"
            class="fab-floating w-[52px] h-[52px] rounded-full bg-gradient-to-tr from-lime-400 via-lime-300 to-lime-200
                   ring-[3px] ring-green-50 dark:ring-[#0A1F1B]
                   flex items-center justify-center
                   cursor-pointer group active:scale-95 transition-all shadow-xl">
            <i data-lucide="plus" class="w-6 h-6 text-green-950 stroke-[2.8] transition-transform duration-300 group-hover:rotate-90"></i>
          </button>
        </div>

        <!-- Sisi Kanan: 2 menu (Stats & Settings) -->
        <div class="flex-1 flex items-center justify-evenly pl-7">
          <!-- 4. Stats -->
          <a href="#/weekly" data-nav="#/weekly" data-label="Stats"
             class="nav-item p-2.5 rounded-full text-green-300/60 hover:text-green-100 transition-all duration-200">
            <i data-lucide="bar-chart-3" class="w-[20px] h-[20px]"></i>
          </a>

          <!-- 5. Settings -->
          <a href="#/settings" data-nav="#/settings" data-label="Settings"
             class="nav-item p-2.5 rounded-full text-green-300/60 hover:text-green-100 transition-all duration-200">
            <i data-lucide="settings" class="w-[20px] h-[20px]"></i>
          </a>
        </div>
      </nav>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- QUICK ADD TRANSACTION MODAL / DRAWER       -->
  <!-- ========================================== -->
  <div id="addModalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden opacity-0 transition-opacity duration-200 flex items-end justify-center">
    <!-- Click outside backdrop -->
    <div onclick="closeAddModal()" class="absolute inset-0"></div>

    <!-- Slide-up Drawer Container -->
    <div id="addModalDrawer" class="relative w-full max-w-[480px] bg-white dark:bg-[#132A23] rounded-t-[32px] p-5 sm:p-6 shadow-2xl border-t border-gray-100 dark:border-[#1F4A3C] translate-y-full transition-transform duration-300 z-10 max-h-[90vh] overflow-y-auto">

      <!-- Drawer Handle indicator -->
      <div class="w-12 h-1.5 bg-gray-300 dark:bg-green-700/60 rounded-full mx-auto mb-4"></div>

      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-lg font-bold text-gray-900 dark:text-green-50 leading-tight">Tambah Transaksi</h3>
          <p class="text-xs text-gray-400 dark:text-green-300/60">Catat pemasukan atau pengeluaran baru</p>
        </div>
        <button onclick="closeAddModal()" class="btn-compact w-8 h-8 rounded-full bg-gray-100 dark:bg-[#1A3B31] flex items-center justify-center text-gray-500 hover:text-gray-900 dark:hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Form -->
      <form id="quickAddForm" onsubmit="handleQuickAddSubmit(event)" class="space-y-4">

        <!-- Type Selector (Pengeluaran vs Pemasukan) -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-green-300/60 mb-1.5">Tipe Transaksi</label>
          <div class="grid grid-cols-2 gap-2 bg-gray-100 dark:bg-[#1A3B31] p-1 rounded-xl">
            <button
              type="button"
              onclick="setModalType('expense')"
              id="modal-type-expense"
              class="tab-btn py-2.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-red-500 text-white shadow-sm">
              <i data-lucide="trending-down" class="w-4 h-4"></i> Pengeluaran
            </button>
            <button
              type="button"
              onclick="setModalType('income')"
              id="modal-type-income"
              class="tab-btn py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 text-gray-500 dark:text-green-300/60">
              <i data-lucide="trending-up" class="w-4 h-4"></i> Pemasukan
            </button>
          </div>
          <input type="hidden" id="modal-type-input" value="expense" />
        </div>

        <!-- Amount Input -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-green-300/60 mb-1.5">Nominal (Rp)</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-sm text-gray-400">Rp</span>
            <input
              type="number"
              id="modal-amount-input"
              required
              min="1"
              placeholder="0"
              class="w-full h-12 pl-11 pr-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1A3B31] text-gray-900 dark:text-green-50 text-base font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition-colors"
            />
          </div>
        </div>

        <!-- Item Name / Description -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-green-300/60 mb-1.5">Keterangan / Nama Barang</label>
          <input
            type="text"
            id="modal-name-input"
            required
            placeholder="Contoh: Kopi, Makan Siang, Gaji..."
            class="w-full h-12 px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1A3B31] text-gray-900 dark:text-green-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition-colors"
          />
        </div>

        <!-- Wallet Picker -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-green-300/60 mb-1.5">Pilih Wallet</label>
          <select
            id="modal-wallet-select"
            required
            class="w-full h-12 px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1A3B31] text-gray-900 dark:text-green-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition-colors">
            <!-- Populated dynamically -->
          </select>
        </div>

        <!-- Category Picker -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-green-300/60 mb-1.5">Pilih Kategori</label>
          <select
            id="modal-category-select"
            required
            class="w-full h-12 px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1A3B31] text-gray-900 dark:text-green-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition-colors">
            <!-- Populated dynamically -->
          </select>
        </div>

        <!-- Date Picker -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-green-300/60 mb-1.5">Tanggal</label>
          <input
            type="date"
            id="modal-date-input"
            required
            class="w-full h-12 px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1A3B31] text-gray-900 dark:text-green-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition-colors"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full mt-2 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-bold text-sm px-6 py-3.5 rounded-xl transition-all shadow-lg shadow-green-600/30 flex items-center justify-center gap-2">
          <i data-lucide="check" class="w-4 h-4"></i> Simpan Transaksi
        </button>

      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SETTINGS MODAL (TOP POSITIONED - NO SCROLL)-->
  <!-- ========================================== -->
  <div id="settingsModalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden opacity-0 transition-opacity duration-200 flex items-start justify-center p-3 sm:p-4 pt-4 sm:pt-8 overflow-y-auto">
    <!-- Click outside backdrop -->
    <div onclick="closeSettingsModal()" class="fixed inset-0"></div>

    <!-- Modal Box Container (Tampil di atas tanpa harus scroll) -->
    <div id="settingsModalDrawer" class="relative w-full max-w-[440px] bg-white dark:bg-[#132A23] rounded-[28px] p-5 sm:p-6 shadow-2xl border border-gray-100 dark:border-[#1F4A3C] transition-all duration-200 -translate-y-6 opacity-0 z-10 my-auto sm:my-0">
      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-3.5">
        <div>
          <h3 id="settingsModalTitle" class="text-lg font-bold text-gray-900 dark:text-green-50 leading-tight">Modal Title</h3>
          <p id="settingsModalSubtitle" class="text-[11px] text-gray-400 dark:text-green-300/60 mt-0.5">Kelola pengaturan</p>
        </div>
        <button onclick="closeSettingsModal()" class="btn-compact w-8 h-8 rounded-full bg-gray-100 dark:bg-[#1A3B31] flex items-center justify-center text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div id="settingsModalBody"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SCRIPTS                                     -->
  <!-- ========================================== -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/views/dashboard.js"></script>
  <script src="assets/js/views/transactions.js"></script>
  <script src="assets/js/views/transactionDetail.js"></script>
  <script src="assets/js/views/walletDetail.js"></script>
  <script src="assets/js/views/wallets.js"></script>
  <script src="assets/js/views/stats.js"></script>
  <script src="assets/js/views/settings.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- Quick Add Modal Handlers -->
  <script>
    function openAddModal(preferredType = 'expense', preselectedWalletId = null) {
      const overlay = document.getElementById('addModalOverlay');
      const drawer = document.getElementById('addModalDrawer');
      if (!overlay || !drawer) return;

      // Populate wallets
      const wallets = Store.getWallets();
      const walletSelect = document.getElementById('modal-wallet-select');
      walletSelect.innerHTML = wallets.map(w => `
        <option value="${w.id}" ${preselectedWalletId === w.id ? 'selected' : ''}>${w.name} (${formatCurrencyShort(w.balance)})</option>
      `).join('');
      if (preselectedWalletId) {
        walletSelect.value = preselectedWalletId;
      }

      // Set date to today
      document.getElementById('modal-date-input').value = todayISO();

      // Set type
      setModalType(preferredType);

      // Show overlay with animation
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        drawer.classList.remove('translate-y-full');
      }, 10);

      lucide.createIcons();
    }

    function closeAddModal() {
      const overlay = document.getElementById('addModalOverlay');
      const drawer = document.getElementById('addModalDrawer');
      if (!overlay || !drawer) return;

      drawer.classList.add('translate-y-full');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 250);
    }

    function setModalType(type) {
      document.getElementById('modal-type-input').value = type;
      const expBtn = document.getElementById('modal-type-expense');
      const incBtn = document.getElementById('modal-type-income');

      if (type === 'expense') {
        expBtn.className = 'tab-btn py-2.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-red-500 text-white shadow-sm';
        incBtn.className = 'tab-btn py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 text-gray-500 dark:text-green-300/60 hover:text-green-600';
      } else {
        incBtn.className = 'tab-btn py-2.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-green-600 text-white shadow-sm';
        expBtn.className = 'tab-btn py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 text-gray-500 dark:text-green-300/60 hover:text-red-500';
      }

      // Update categories dropdown based on type
      const categories = Store.getCategoriesByType(type);
      const catSelect = document.getElementById('modal-category-select');
      catSelect.innerHTML = categories.map(c => `
        <option value="${c.id}">${c.name}</option>
      `).join('');

      lucide.createIcons();
    }

    function handleQuickAddSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('modal-type-input').value;
      const amount = parseFloat(document.getElementById('modal-amount-input').value);
      const itemName = document.getElementById('modal-name-input').value.trim();
      const walletId = document.getElementById('modal-wallet-select').value;
      const categoryId = document.getElementById('modal-category-select').value;
      const date = document.getElementById('modal-date-input').value;

      if (!amount || amount <= 0 || !walletId) return;

      // Save transaction
      Store.addTransaction({
        type,
        amount,
        itemName,
        walletId,
        categoryId,
        date,
        createdAt: new Date().toISOString()
      });

      // Close modal
      closeAddModal();
      document.getElementById('quickAddForm').reset();

      // Re-render active view
      if (typeof App !== 'undefined' && App.currentView === 'transactions') {
        renderTransactions();
      } else if (typeof App !== 'undefined' && App.currentView === 'wallets') {
        renderWallets();
      } else if (typeof App !== 'undefined' && App.currentView === 'stats') {
        renderStats();
      } else if (typeof App !== 'undefined' && App.currentView === 'wallet-detail') {
        if (typeof currentWalletDetailId !== 'undefined' && currentWalletDetailId) {
          renderWalletDetail(currentWalletDetailId);
        } else {
          renderDashboard();
        }
      } else if (typeof App !== 'undefined' && App.currentView === 'settings') {
        renderSettings();
      } else {
        if (typeof currentTxTab !== 'undefined' && currentTxTab !== 'all' && currentTxTab !== type) {
          currentTxTab = type;
        }
        renderDashboard();
      }

      // Show toast
      const toast = document.createElement('div');
      toast.id = 'pw-toast';
      toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-green-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg border border-green-700 animate-scale-pop flex items-center gap-2';
      toast.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-lime-400"></i> Transaksi berhasil ditambahkan!`;
      document.body.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), 2500);
    }
  </script>

</body>
</html>
